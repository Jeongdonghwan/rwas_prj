<!doctype html><meta charset="utf-8">
<style>
html,body{margin:0;font:13px system-ui;background:#eee}
.row{display:flex;gap:10px;padding:10px}
.col{flex:1}
.col h4{margin:0 0 6px;padding:5px 9px;background:#333;color:#fff;font-size:12px}
iframe{width:100%;height:560px;border:0;background:#fff;display:block}
</style>
<div class="row">
  <div class="col"><h4>BEFORE</h4><iframe id="a" src="/"></iframe></div>
  <div class="col"><h4>AFTER</h4><iframe id="b" src="/"></iframe></div>
</div>
<script>
function prep(f, old){
  f.addEventListener('load', function(){
    var d=this.contentDocument;
    if(old){
      d.querySelectorAll('link[rel=stylesheet]').forEach(function(l){ l.remove(); });
      var L=d.createElement('link'); L.rel='stylesheet'; L.href='/static/_cmp/old.css';
      d.head.appendChild(L);
    }
    setTimeout(function(){
      var st=d.createElement('style');
      st.textContent='.reveal,.stagger>*,.deep>*{opacity:1!important;transform:none!important}';
      d.head.appendChild(st);
      d.querySelector('#consult, .sec')&&null;
      this.contentWindow.scrollTo(0,1050);
    }.bind(this),250);
  });
}
prep(document.getElementById('a'),true);
prep(document.getElementById('b'),false);
</script>
