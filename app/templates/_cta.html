<section class="cta-band"><div class="wrap">
  <h2>{{ cta_title | default('상담은 무료이고, 신청 여부는 그 다음에 정하셔도 됩니다.') }}</h2>
  <p>{{ cta_sub | default('채무 현황만 알려주시면 예상 월 변제금을 먼저 계산해드립니다.') }}</p>
  <a class="btn" href="{{ url_for('contact.contact') }}#form">상담 신청</a><a class="btn red" href="tel:{{ site.phone_link }}">전화 {{ site.phone }}</a>
  <p style="position:relative;margin-top:22px;font-size:13px;color:rgba(255,255,255,.55)">{{ site.firm_name }} · 이재열 변호사가 직접 상담합니다</p>
</div></section>
