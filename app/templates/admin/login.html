<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>관리자 로그인 | {{ site.firm_name }}</title>
<link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" sizes="48x48">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}?v={{ asset_ver }}">
</head>
<body class="login-body">
<main class="login-wrap">
  <form class="login-card" method="post" autocomplete="on">
    <div class="login-logo">
      <img src="{{ url_for('static', filename='img/emblem.png') }}" alt="" width="34" height="31">
      <b>법률사무소 레이<small>LEI LAW OFFICE</small></b>
    </div>
    <h1>관리자 로그인</h1>
    {% if error %}<p class="login-err">{{ error }}</p>{% endif %}
    <label for="u">아이디</label>
    <input id="u" name="username" autocomplete="username" required autofocus>
    <label for="p">비밀번호</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <label class="login-keep"><input type="checkbox" name="remember" value="1"> 로그인 상태 유지</label>
    <button class="btn wide" type="submit">로그인</button>
    <p class="login-foot"><a href="{{ url_for('main.index') }}">← 홈페이지로</a></p>
  </form>
</main>
</body>
</html>
