<form class="hero-form" id="form" action="{{ url_for('contact.submit') }}" method="post">
  <h3>무료 상담 신청</h3>
  <p class="sub">접수 후 30분 안에 담당자가 연락드립니다.</p>
  {% with messages = get_flashed_messages(category_filter=['error']) %}
    {% for m in messages %}<p class="flash">{{ m }}</p>{% endfor %}
  {% endwith %}
  <input type="hidden" name="source_path" value="{{ request.path }}">
  <div class="field"><label for="n">이름</label><input id="n" name="name" required placeholder="홍길동"></div>
  <div class="field"><label for="p">연락처</label><input id="p" name="phone" type="tel" required placeholder="010-0000-0000"></div>
  <div class="field"><label for="d">총 채무액</label>
    <select id="d" name="debt"><option value="">선택</option><option>3천만원 이하</option><option>3천–7천만원</option><option>7천만–1억5천</option><option>1억5천 이상</option></select></div>
  <div class="field"><label for="a">거주 지역</label>
    <select id="a" name="area"><option value="">선택</option><option>장안구</option><option>권선구</option><option>팔달구</option><option>영통구</option><option>수원 외 경기 남부</option></select></div>
  <label class="agree"><input type="checkbox" name="agree" value="1" required> 개인정보 수집·이용에 동의합니다. (상담 목적 외 사용하지 않습니다)</label>
  <button class="btn red wide" type="submit">상담 신청하기</button>
  <p class="tel">전화가 편하시면 <b>{{ site.phone }}</b></p>
</form>
