<p>상담에서 가장 먼저 하는 일은 신청이 맞는지 따져보는 것입니다. 소득과 채무 구성을 보고 개인회생보다 파산이나 신용회복이 나은 경우에는 그렇게 말씀드립니다. 사건을 맡기로 정한 뒤에는 담당 변호사가 첫 상담부터 면책까지 직접 진행하고, 단계가 바뀔 때마다 전화나 문자로 상황을 알려드립니다.</p>
<p>2016년 개업 이후 {{ court }} 사건을 중심으로 일해왔습니다. 법원마다 다른 실무 기준을 변제계획안 작성 단계에서부터 반영해 보정명령을 줄이는 것이, 결국 전체 기간을 줄이는 가장 현실적인 방법이라고 봅니다.</p>
